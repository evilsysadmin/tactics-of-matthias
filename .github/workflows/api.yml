name: Tactics API contracts

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

concurrency:
  # Superseded PR revisions may be cancelled, but every main SHA is verified.
  group: tactics-api-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: Tactics Go API contracts
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TACTICS_MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017/?directConnection=true
      GOTOOLCHAIN: local
    timeout-minutes: 6
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: api/go.sum
      - name: Assert patched Go compiler
        run: test "$(go env GOVERSION)" = 'go1.27.4'
      - name: Verify checked-in dependency sums
        run: go mod verify
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Install pinned Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Reject reachable known Go vulnerabilities
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
