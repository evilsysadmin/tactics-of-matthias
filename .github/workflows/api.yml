name: Tactics API contracts

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

concurrency:
  group: tactics-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Tactics Go API contracts
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TACTICS_MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017/?directConnection=true
    timeout-minutes: 6
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false
      - run: go test ./... -count=1
      - run: go vet ./...
