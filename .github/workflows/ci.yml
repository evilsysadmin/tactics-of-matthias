name: Tactics CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tactics-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Portable tactics profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
